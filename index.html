<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Tabletop — Mesa de imersão</title>
<style>
:root{--bg:#0a0b0d;--bg2:#101216;--bg3:#171a1f;--line:#262a31;--tx:#e8e3d6;--mut:#8f9399;--ac:#c1121f;--ac2:#e5383b;--gold:#c9a227;--ok:#3ecf6e;--warn:#e6b33a;--bad:#d34040;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#root{height:100dvh}
button,input,select{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=number],select{background:#0c0e11;border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid #c1121f66;border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac2)}
input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.muted{color:var(--mut)}.sm{font-size:12px}.grow{flex:1}
.err{color:#ff8a8a;font-size:13px;margin:8px 0}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;transition:.12s;touch-action:manipulation}
.btn:hover{border-color:#3a3f48;background:#1d2127}
.btn.primary{background:var(--ac);border-color:var(--ac2);color:#fff;font-weight:600}.btn.primary:hover{background:var(--ac2)}
.btn.danger{border-color:#6a2326;color:#ff9a9a}.btn.danger:hover{background:#3a1416}
.btn.ghost{background:none}.btn.small{padding:5px 10px;font-size:13px}.btn.big{padding:12px 18px;font-size:15px}
.btn.live{border-color:#1d6b3a;color:var(--ok)}
.btn:disabled,.mini:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btncol{display:flex;flex-direction:column;gap:8px;margin:10px 0}.btncol .btn{text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;touch-action:manipulation;white-space:nowrap}
.chip.sm{padding:3px 10px;font-size:12px}.chip.on{background:#3a1a1d;border-color:var(--ac2);color:#fff}.chip.add{border-style:dashed}
.states .chip.st-dying.on{background:#5a1216;border-color:#e0313a}.states .chip.st-dead.on{background:#333;border-color:#999}
.mini{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer;min-width:26px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle}.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h2{margin:6px 0 8px;font-size:22px;font-weight:700}
/* telas */
.screen.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:22px;background:radial-gradient(1200px 600px at 50% -10%,#2a0f12 0,transparent 60%),var(--bg);overflow:auto}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(420px,100%);box-shadow:0 20px 50px #0008}
.card.wide{width:min(560px,100%)}.card.dim{opacity:.7}.card.hl{border-color:var(--ac2);box-shadow:0 0 0 1px var(--ac2),0 20px 50px #0008}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%}
.cards .card input.code{font-size:26px;letter-spacing:.3em;text-align:center;text-transform:uppercase;margin:6px 0 12px;font-weight:700}
.cards .btn.big{width:100%}.brand{text-align:center}.logo{font-weight:800;letter-spacing:.32em;color:var(--tx)}.logo.big{font-size:34px;color:#fff;text-shadow:0 0 22px #c1121f88}
details summary{cursor:pointer;color:var(--mut);margin:8px 0}.adv label{display:block;margin:6px 0;font-size:12px;color:var(--mut)}
/* editor do mestre */
#app{display:grid;height:100dvh;grid-template-columns:64px minmax(0,1fr) 340px;grid-template-rows:48px minmax(0,1fr) 42px}
#top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#top .logo{font-size:13px;margin-right:4px}#top .cname{width:200px;font-weight:600}#top .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#tools{grid-column:1;grid-row:2;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto}
.tool{background:none;border:1px solid transparent;border-radius:9px;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:1px;touch-action:manipulation}
.tool:hover{background:var(--bg3)}.tool.on{background:#3a1a1d;border-color:var(--ac2)}.tool .ic{font-size:19px;line-height:1.1}.tool .tl{font-size:10px;color:var(--mut)}.tool.on .tl{color:#fff}.tools .sp,#tools .sp{flex:1}
#center{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0}
#optbar{display:flex;gap:16px;align-items:center;padding:6px 12px;background:#0d0f12;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
#optbar label{display:flex;align-items:center;gap:8px}#optbar input[type=range]{width:120px}#optbar select{width:auto}
#stagewrap{position:relative;flex:1;min-height:0;background:#000}
.stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#1a1a1e;border:1px solid var(--ac2);padding:6px 12px;border-radius:999px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:3}
.emptystate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.emptystate .card{pointer-events:auto;text-align:left}
#panel{grid-column:3;grid-row:2;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:5}
.ptabs{display:flex;border-bottom:1px solid var(--line)}.ptab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer;color:var(--mut);font-size:12.5px}.ptab.on{color:#fff;border-color:var(--ac2)}
.pbody{padding:12px;overflow:auto;flex:1;min-height:0}
#areasbar{grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.menuwrap{position:relative}.menu{position:absolute;top:calc(100% + 6px);left:0;background:#15181d;border:1px solid var(--line);border-radius:10px;min-width:220px;padding:6px;z-index:30;box-shadow:0 14px 40px #000a;display:flex;flex-direction:column}
.menu.up{top:auto;bottom:calc(100% + 6px)}.menu[hidden]{display:none}.menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}.menu button:hover{background:var(--bg3)}
.panel-toggle{display:none}
/* painel: catálogo */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}.citem{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
.citem canvas{border-radius:6px;max-width:100%}.citem:hover{border-color:#3a3f48}.citem.on{border-color:var(--ac2);color:#fff;background:#2a1517}
/* painel: inspetor / listas */
.ititle{font-weight:700;font-size:15px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;align-items:center;margin:7px 0;font-size:13px}.row>span{color:var(--mut)}
.row.chkrow{grid-template-columns:auto 1fr auto}.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac2)}.inline{display:flex;gap:6px}
.osec .lbl{margin-top:12px}.orow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}.orow:hover{background:var(--bg3)}.orow.on{background:#2a1517;outline:1px solid var(--ac)}.on-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg3)}.prow.on{border-color:var(--ac2)}.pav{width:42px;height:42px;background:#0c0e11;border-radius:8px}.pinfo{flex:1;min-width:0}.pname{font-weight:600;margin-bottom:4px}.pact{display:flex;flex-direction:column;gap:4px}
.chips.mini .chip{padding:2px 8px;font-size:11px}
/* editor de personagem */
.ced-top{display:flex;gap:14px;align-items:center}.cprev{width:112px;height:112px;border-radius:12px;border:1px solid var(--line);flex:none}.ced-fields{flex:1;min-width:0}.ced-fields .btnrow{margin:8px 0 0}
.ced .two{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:10px 0}.ced .two label{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
.crop{display:grid;gap:4px;margin:10px 0}.crop label{display:grid;grid-template-columns:50px 1fr;font-size:12px;color:var(--mut);align-items:center}
/* jogador */
.play{position:fixed;inset:0;background:#000;overflow:hidden}
.waiting{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000d;z-index:4}.spin{width:34px;height:34px;border:3px solid #333;border-top-color:var(--ac2);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:6}.fade.on{opacity:1}
.hud-tl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;gap:8px;z-index:3}
.pill{background:#0b0c0fcc;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;backdrop-filter:blur(6px);display:flex;align-items:center;color:var(--tx)}.btn-pill{cursor:pointer}
.hud-bl{position:absolute;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3}.me{display:flex;align-items:center;gap:8px;background:#0b0c0fcc;border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 5px;cursor:pointer;backdrop-filter:blur(6px);font-weight:600}.me canvas{width:36px;height:36px;border-radius:50%;background:#101216}
.hud-br{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}.fab{width:44px;height:44px;border-radius:50%;background:#0b0c0fcc;border:1px solid var(--line);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
.hud-b{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:3;pointer-events:none;padding:0 70px}.prompt{pointer-events:auto;font-size:16px;padding:14px 22px;border-radius:999px;box-shadow:0 8px 30px #000a,0 0 0 3px #c1121f44;animation:pop .25s}.prompt.locked{background:#3a3a3e;border-color:#666}@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78dvh;overflow:auto;background:var(--bg2);border-top:1px solid var(--ac);border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));z-index:7;box-shadow:0 -20px 50px #000a}.sheet[hidden]{display:none}.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px}.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;display:flex;flex-direction:column;gap:8px;z-index:99;pointer-events:none;align-items:center}.toast{background:#17191ef2;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 8px 30px #000a;transition:.35s;max-width:90vw;text-align:center}.toast.out{opacity:0;transform:translateY(8px)}
@media (max-width:860px){
  #app{grid-template-columns:54px minmax(0,1fr)}#panel{position:fixed;right:0;top:48px;bottom:42px;width:min(92vw,340px);transform:translateX(100%);transition:transform .2s;box-shadow:-20px 0 50px #000a}#panel.open{transform:none}.panel-toggle{display:inline-block}
  #top .cname{width:120px}.tool .tl{display:none}
}

/* modal */
.modalback{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px #000c}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:14px 16px;overflow:auto;min-height:0}.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.modal .x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.msz{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}.msz canvas{width:230px;height:230px;border-radius:10px;background:#0c0e11;border:1px solid var(--line)}
.msz .fields{display:flex;flex-direction:column;gap:8px;min-width:0}.msz .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msz .two label,.msz label.f{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.msz .q{font-size:12px;padding:6px 9px;border-radius:7px;background:#14171c;border:1px solid var(--line)}.q.good{border-color:#1d6b3a;color:#8fe3ae}.q.mid{border-color:#7a6a1d;color:#e6d27a}.q.low{border-color:#6a2326;color:#ff9a9a}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px}.chk input{width:16px;height:16px;accent-color:var(--ac2)}
@media (max-width:640px){.msz{grid-template-columns:1fr}.msz canvas{width:100%;height:auto;aspect-ratio:1}}
.optbar-x{margin-left:auto}
.citem.on{box-shadow:0 0 0 2px var(--ac2) inset}
.popmenu{position:fixed!important;top:0;left:0;z-index:80}

/* ---- login / onboarding / painel ---- */
.authcard{display:flex;flex-direction:column;gap:10px}.authcard .f,.card .f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.tabs{display:flex;background:var(--bg3);border-radius:9px;padding:3px;gap:3px}.tab{flex:1;background:none;border:0;border-radius:7px;padding:8px;cursor:pointer;color:var(--mut)}.tab.on{background:#3a1a1d;color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}.gbtn .g{font-weight:800;color:#4285f4;background:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px}.linkbtn:hover{color:var(--tx)}
.okmsg{color:#7fe0a0;font-size:13px}.okmsg:empty{display:none}.err:empty{display:none}
.invite{background:#1d1a0f;border:1px solid #5a4a1a;border-radius:9px;padding:10px 12px;font-size:13px}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{width:26px;height:4px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ac2)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rolecard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.rolecard.on{border-color:var(--ac2);background:#2a1215}
.home{min-height:100dvh;overflow:auto;padding:0 18px 40px;background:radial-gradient(1200px 500px at 50% -10%,#2a0f12 0,transparent 60%),var(--bg)}
.homebar{display:flex;align-items:center;justify-content:space-between;padding:16px 4px;max-width:1000px;margin:0 auto}.who{display:flex;align-items:center;gap:10px}.tag{font-size:11px;background:#2a2410;border:1px solid #5a4a1a;border-radius:999px;padding:2px 8px;color:var(--gold);font-style:normal}
.guestnote{max-width:1000px;margin:0 auto 12px;background:#1d1a0f;border:1px solid #5a4a1a;border-radius:9px;padding:9px 12px;font-size:13px}
.homegrid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;max-width:1000px;margin:0 auto}.homegrid .card{width:auto}@media(max-width:760px){.homegrid{grid-template-columns:1fr}.roles{grid-template-columns:1fr}}
.mesas,.chars{display:flex;flex-direction:column;gap:8px}.mesa{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.mesa .mi{flex:1;min-width:0;display:flex;flex-direction:column}.mesa .mi b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mesa .ma{display:flex;gap:6px}.mesa .pav{width:48px;height:48px;flex:none}
.homegrid input.code{font-size:18px;letter-spacing:.25em;text-align:center;text-transform:uppercase;font-weight:700}
.cloudstate{font-size:12px;color:var(--mut);white-space:nowrap}.cloudstate.saved{color:#7fe0a0}.cloudstate.error{color:#ff8a8a}.bigcode{font-size:26px;font-weight:800;letter-spacing:.3em;color:var(--gold)}

</style>

<body>
<div id="root"></div>
<script>
/* ---- core.js ---- */
'use strict';
/* ===== core.js — utilidades, modelo de dados e assets ===== */

function makeCanvas(w, h) {
  if (globalThis.__makeCanvas) return globalThis.__makeCanvas(w, h);
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function uid(p) { return (p || 'i') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function rng(seed) {
  let a = (seed | 0) >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) {
  h = String(h || '#000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function toHex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
function shade(h, amt) { // -1..1, devolve hex
  const [r, g, b] = hexToRgb(h);
  const f = c => amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
  return toHex(f(r), f(g), f(b));
}
function mix(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return toHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
}
function inR(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function rotPoint(px, py, cx, cy, deg) {
  const a = -deg * Math.PI / 180, dx = px - cx, dy = py - cy;
  return [cx + dx * Math.cos(a) - dy * Math.sin(a), cy + dx * Math.sin(a) + dy * Math.cos(a)];
}
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

/* ---------- Assets (imagens) ---------- */
const Assets = {
  data: {},      // id -> dataURL
  imgs: {},      // id -> Image carregada
  loading: {},
  onLoad: null,
  put(id, url) { this.data[id] = url; delete this.imgs[id]; delete this.loading[id]; if (this.onLoad) this.onLoad(id); },
  has(id) { return !!this.data[id]; },
  get(id) {
    if (!id) return null;
    if (this.imgs[id]) return this.imgs[id];
    const url = this.data[id];

function shingleRows(P, x, y, w, h, hex, vert) {

  } else {
    for (let j = 0, col = 0; j < w; j += 3, col++) { P.vl(x + j + 2, y, h, dk); P.vl(x + j, y, h, lt); for (let i = (col % 2) * 3; i < h; i += 6) P.hl(x + j, y + i, 3, r.d1); }
  }

}

/* Preenche a luz com um gradiente radial restrito ao cone. mode 'cut' acumula por destination-out; 'add' por screen.

          h('button', { class: 'btn small danger', onclick: () => askConfirm('Excluir o personagem "' + c.name + '"?', async () => { try { await Cloud.deleteCharacter(c.id); load(); } catch (x) { toast(friendlyAuthError(x)); } }, 'Excluir') }, '🗑'))));
      }
    } catch (e) { chars.innerHTML = ''; chars.append(h('div', { class: 'err' }, friendlyAuthError(e))); }
  }
  function renameModal(m) {
    const i = h('input', { type: 'text', maxlength: 40, value: m.name }); modal('Renomear campanha', i, [{ label: 'Cancelar' }, { label: 'Salvar', cls: 'primary', fn: () => { Cloud.renameCampaign(m.id, i.value.trim() || m.name).then(load).catch(x => toast(friendlyAuthError(x))); } }]);
  }
  function charModal(c) {
    const ch = c ? charToProfile(c) : { name: '', frame: 'circle', color: '#c9a227', alpha: 1, state: 'normal', asset: null, zoom: 1, ox: 0, oy: 0 };
    const ed = CharacterEditor({ pid: userPid(), char: ch, onChange: () => { } });
    modal(c ? 'Editar personagem' : 'Novo personagem', ed, [{ label: 'Cancelar' }, { label: 'Salvar', cls: 'primary', fn: () => { if (!(ch.name || '').trim()) { toast('Dê um nome ao personagem.'); return false; } Cloud.saveCharacter(profileToChar(ch, c && c.id)).then(load).catch(x => toast(friendlyAuthError(x))); } }]);
  }
  load();
}

function upgradeGuestModal() {
  const m = h('input', { type: 'text', inputmode: 'email', placeholder: 'e-mail' }), p = h('input', { type: 'password', placeholder: 'senha (mín. 6)' }), err = h('div', { class: 'err' });
  const body = h('div', {}, h('p', { class: 'muted' }, 'Suas mesas e personagens continuam exatamente como estão.'), h('label', { class: 'f' }, 'E-mail', m), h('label', { class: 'f' }, 'Senha', p), err);
  modal('Criar conta', body, [{ label: 'Cancelar' }, { label: 'Criar conta', cls: 'primary', fn: () => {
    if (!/^\S+@\S+\.\S+$/.test(m.value.trim()) || p.value.length < 6) { err.textContent = 'Informe um e-mail válido e uma senha com 6+ caracteres.'; return false; }
    Cloud.upgradeGuest(m.value.trim(), p.value).then(() => { toast('Conta criada. Confirme o e-mail se o Supabase pedir.'); showHome(); }).catch(x => toast(friendlyAuthError(x), 4000)); } }]);
}

/* entrar numa mesa pelo código: valida (e registra) a participação e abre a tela do personagem */
async function enterTable(code, charId, errEl) {
  try {
    const t = await Cloud.joinCampaign(code, charId || null);
    let pc = null; const cs = await Cloud.myCharacters(); const pick = cs.find(c => c.id === charId) || cs[0] || null; if (pick) pc = charToProfile(pick);
    const prof = { pid: userPid(), name: pc ? pc.name : (Cloud.profile && Cloud.profile.display_name) || '', char: pc || { frame: 'circle', color: '#c9a227', alpha: 1, state: 'normal', asset: null, zoom: 1, ox: 0, oy: 0 } };
    store.set('vtt-player', prof); if (pc && pc.asset) store.set('vtt-passet', { id: pc.asset, data: Assets.data[pc.asset] }); else store.set('vtt-passet', null);
    startPlayer(String(code).toUpperCase(), { mode: 'online', url: CLOUD.url, key: CLOUD.key, cloud: true, characterId: pick ? pick.id : null, tableName: t && (t.campaign_name || t.out_campaign_name) });
  } catch (e) { const msg = friendlyAuthError(e); if (errEl) errEl.textContent = msg; else { toast(msg, 4000); showHome(); } }
}

function goHome() { if (Cloud.ready && Cloud.user) showHome(); else showLobby(); }

/* ---- ui_main.js ---- */
'use strict';
/* ===== ui_main.js — lobby e inicialização ===== */

function parseHash() {
  const o = {}; const hs = (location.hash || '').replace(/^#/, ''); if (!hs) return o;
  hs.split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  return o;
}
function showLobby() {
  const root = $('#root'); root.innerHTML = '';
  const hs = parseHash(), saved = store.get('vtt-cfg', {}), prof = store.get('vtt-player', {});
  const join = { code: (hs.join || '').toUpperCase(), mode: hs.m || (hs.u ? 'online' : (saved.mode || 'local')), url: hs.u || saved.url || '', key: hs.k || saved.key || '' };
  const err = h('div', { class: 'err' });
  const codeIn = h('input', { type: 'text', maxlength: 8, placeholder: 'CÓDIGO', value: join.code, class: 'code', oninput: e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); } });
  const modeSel = h('select', { value: join.mode, onchange: () => adv() }, h('option', { value: 'local' }, 'Local (mesmo navegador)'), h('option', { value: 'online' }, 'Online (Supabase)'));
  const urlIn = h('input', { type: 'text', placeholder: 'https://xxxx.supabase.co', value: join.url }), keyIn = h('input', { type: 'password', placeholder: 'chave pública', value: join.key });
  const advBox = h('div', { class: 'adv' }, h('label', {}, 'Modo', modeSel), h('label', { class: 'online' }, 'URL', urlIn), h('label', { class: 'online' }, 'Chave', keyIn));
  const showAdv = !hs.join;
  function adv() { advBox.querySelectorAll('.online').forEach(e => e.style.display = modeSel.value === 'online' ? '' : 'none'); }
  adv();
  const go = () => {
    const code = codeIn.value.trim(); if (code.length < 3) { err.textContent = 'Digite o código da mesa que o mestre enviou.'; return; }
    const cfg = { mode: modeSel.value, url: urlIn.value.trim(), key: keyIn.value.trim() };
    if (cfg.mode === 'online' && (!cfg.url || !cfg.key)) { err.textContent = 'Informe a URL e a chave (ou use o link completo enviado pelo mestre).'; return; }
    startPlayer(code, cfg);
  };
  root.append(h('div', { class: 'screen center lobby' },
    h('div', { class: 'brand' }, h('div', { class: 'logo big' }, 'TABLETOP'), h('p', { class: 'muted' }, 'Mesa de imersão para RPG de investigação paranormal')),
    h('div', { class: 'cards' },
      h('div', { class: 'card' + (hs.join ? ' dim' : '') }, h('div', { class: 'eyebrow' }, 'Mestre'), h('h2', {}, 'Montar a mesa'), h('p', { class: 'muted' }, 'Crie mapas com o catálogo ou com uma imagem, posicione zonas, luzes, névoa e criaturas ocultas.'),
        h('button', { class: 'btn primary big', onclick: () => startMaster() }, 'Abrir editor do mestre')),
      h('div', { class: 'card' + (hs.join ? ' hl' : '') }, h('div', { class: 'eyebrow' }, 'Jogador'), h('h2', {}, 'Entrar na mesa'), h('p', { class: 'muted' }, prof.name ? 'Bem-vindo de volta, ' + prof.name + '.' : 'Use o código (ou o link) que o mestre compartilhou.'),
        codeIn, showAdv ? h('details', {}, h('summary', {}, 'Conexão'), advBox) : advBox, err, h('button', { class: 'btn primary big', onclick: go }, 'Continuar')))));
  if (hs.join) advBox.style.display = 'none';
  codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
/* inicialização: links antigos (modo local / URL própria) vão para o lobby; o resto passa pela conta */
async function boot() {
  const hs = parseHash();
  if (hs.m === 'local' || hs.u) return showLobby();
  const root = $('#root'); root.innerHTML = ''; root.append(h('div', { class: 'screen center' }, h('div', { class: 'spin' }), h('p', { class: 'muted' }, 'Conectando…')));
  try { await Cloud.init(); } catch (e) { toast('Modo offline: ' + (e.message || e), 4500); return showLobby(); }
  if (hs.join) setPending(hs.join.toUpperCase());
  if (!Cloud.user) return showAuth({ joinCode: hs.join ? hs.join.toUpperCase() : '' });
  try { await afterLogin(); } catch (e) { console.error(e); toast(friendlyAuthError(e), 4500); showAuth(); }
}
window.addEventListener('DOMContentLoaded', () => { boot(); });

</script>
