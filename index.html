<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Tabletop — Mesa de imersão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net">
<script id="sb-cdn" async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="window.__sbErr=1"></script>
<style>
/* ============ tokens (cada tema redefine estes valores em themes.js) ============ */
:root{
  --bg:#0a0b0d;--bg2:#101216;--bg3:#171a1f;--line:#262a31;--tx:#e8e3d6;--mut:#8f9399;--ac:#c1121f;--ac2:#e5383b;--gold:#c9a227;--onac:#fff;
  --ok:#3ecf6e;--warn:#e6b33a;--bad:#d34040;--shade:#000a;--r:10px;--r-card:14px;--r-chip:999px;--btn-clip:none;--frame:0 0 0 0 transparent;
  --font-head:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-hero:var(--font-head);--font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:var(--font-body);
  --head-tt:none;--head-ls:0;--head-w:700;--hero-w:800;--h2:22px;
  --dock-w:214px;--corners:none;--cs:0px;--co:5px;--divider:none;--div-h:0px;--ground:none;--wm:none;--distress:none;--stamp:"";
  /* derivados: acompanham o tema automaticamente */
  --ac-soft:color-mix(in srgb,var(--ac) 24%,var(--bg2));--ac-soft2:color-mix(in srgb,var(--ac) 13%,var(--bg2));
  --inp:color-mix(in srgb,var(--bg) 62%,#000);--hov:color-mix(in srgb,var(--bg3) 84%,var(--tx));--line2:color-mix(in srgb,var(--line) 70%,var(--tx));
  --glow:color-mix(in srgb,var(--ac) 50%,transparent);--pop:color-mix(in srgb,var(--bg2) 90%,#000);--hud:color-mix(in srgb,var(--bg) 84%,transparent);
  --gold-soft:color-mix(in srgb,var(--gold) 14%,var(--bg2));--gold-line:color-mix(in srgb,var(--gold) 40%,var(--bg2));
  --bad-tx:color-mix(in srgb,var(--bad) 55%,var(--tx));--ok-tx:color-mix(in srgb,var(--ok) 60%,var(--tx));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font-body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
:root:not([data-mode=classic]) body{font-size:15px;line-height:1.5}
::selection{background:var(--ac);color:var(--onac)}
input,textarea{caret-color:var(--ac2)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
:where(a,button,[tabindex]):focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#root{height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:min(var(--r),8px);padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--glow);border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac2)}
input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.muted{color:var(--mut)}.sm{font-size:12px}.grow{flex:1}
.err{color:var(--bad-tx);font-size:13px;margin:8px 0}
.okmsg{color:var(--ok-tx);font-size:13px}.okmsg:empty,.err:empty{display:none}
/* tipografia temática: títulos têm voz própria; botões e rótulos ficam na fonte de leitura */
:root h2,:root h3,:root .mh,:root .ititle,:root .sheet-h,:root .wordmark,:root .logo{font-family:var(--font-head);text-transform:var(--head-tt);letter-spacing:var(--head-ls);font-weight:var(--head-w)}
h2{margin:6px 0 8px;font-size:var(--h2);line-height:1.15}h3{margin:6px 0;font-size:calc(var(--h2)*.78);line-height:1.2}
.desc,.toast{font-family:var(--font-mono)}
.lbl{font-size:12px;color:var(--mut);margin:14px 0 6px}
:root[data-mode=ordem] .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
/* botões */
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:8px 13px;cursor:pointer;transition:.12s;touch-action:manipulation}
.btn:not(.small):not(.ghost){clip-path:var(--btn-clip)}.btn:focus-visible{clip-path:none}
.btn:hover{border-color:var(--line2);background:var(--hov)}
.btn.primary{background:var(--ac);border-color:var(--ac2);color:var(--onac);font-weight:600}.btn.primary:hover{background:var(--ac2)}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad-tx)}.btn.danger:hover{background:color-mix(in srgb,var(--bad) 22%,var(--bg2))}
.btn.ghost{background:none}.btn.small{padding:5px 10px;font-size:13px}.btn.big{padding:12px 18px;font-size:15px}
.btn.live{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));color:var(--ok-tx)}
.btn:disabled,.mini:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btncol{display:flex;flex-direction:column;gap:8px;margin:10px 0}.btncol .btn{text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-chip);padding:6px 12px;cursor:pointer;font-size:13px;touch-action:manipulation;white-space:nowrap}
.chip.sm{padding:3px 10px;font-size:12px}.chip.on{background:var(--ac-soft);border-color:var(--ac2);color:var(--tx)}.chip.add{border-style:dashed}
.states .chip.st-dying.on{background:color-mix(in srgb,var(--bad) 32%,var(--bg2));border-color:var(--bad)}.states .chip.st-dead.on{background:color-mix(in srgb,var(--mut) 30%,var(--bg2));border-color:var(--mut)}
.mini{background:var(--bg3);border:1px solid var(--line);border-radius:min(var(--r),6px);padding:2px 7px;cursor:pointer;min-width:26px}.mini:hover{background:var(--hov)}.mini.on{background:var(--ac-soft);border-color:var(--ac2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle}.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
details summary{cursor:pointer;color:var(--mut);margin:8px 0}.adv label{display:block;margin:6px 0;font-size:12px;color:var(--mut)}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px}.linkbtn:hover{color:var(--tx)}

/* ============ marca / logo ============ */
.brandlink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:3px 6px;border-radius:8px;cursor:pointer;color:var(--tx);flex:none}
.brandlink:hover{background:var(--hov)}
.brandlink canvas{width:24px;height:24px;display:block}
.wordmark{font-size:14px;letter-spacing:.2em;color:var(--tx);white-space:nowrap}
@media (max-width:1560px){#top .wordmark{display:none}}
.brandlink.big canvas{width:46px;height:46px}.brandlink.big .wordmark{font-size:28px}
.logo{letter-spacing:.32em;color:var(--tx)}.logo.big{font-size:34px;font-family:var(--font-hero);font-weight:var(--hero-w)}
:root:not([data-mode=classic]) .logo.big{font-size:40px;letter-spacing:.08em;line-height:1.1}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.brand .brandmark{width:64px;height:64px}
.tagline{color:var(--mut);margin:0}
:root[data-mode=dnd] .tagline{font-style:italic;font-size:17px}
:root[data-mode=ordem] .tagline{font-family:var(--font-mono);font-size:14px}

/* ============ telas ============ */
.screen{position:relative;z-index:1}
body{background-image:var(--ground)}
.screen.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:64px;flex-direction:column;gap:22px;overflow:auto}
.screen.center::before{content:'';position:fixed;inset:0;background:var(--wm) no-repeat 50% 54%/min(560px,90vw);pointer-events:none}
.screen>*{position:relative}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;width:min(420px,100%);box-shadow:var(--frame),0 20px 50px var(--shade);position:relative}
.card.wide{width:min(560px,100%)}.card.dim{opacity:.7}.card.hl{border-color:var(--ac2)}
/* ornamento de canto: quatro peças desenhadas no tema, sobre a moldura */
.card:not(.nodeco)::after,.modal::after,.hero::before{content:'';position:absolute;inset:var(--co);pointer-events:none;background-image:var(--corners);background-repeat:no-repeat;background-size:var(--cs) var(--cs);background-position:0 0,100% 0,0 100%,100% 100%}
:root[data-mode=dnd] .card,:root[data-mode=dnd] .modal,:root[data-mode=dnd] .sheet{border-color:var(--gold-line)}
:root[data-mode=ordem] .card,:root[data-mode=ordem] .modal{border-color:var(--line2)}
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%}
.cards .card input.code{font-size:26px;letter-spacing:.3em;text-align:center;text-transform:uppercase;margin:6px 0 12px;font-weight:700}
.cards .btn{width:100%}

/* ordem: vocabulário de dossiê */
:root[data-mode=ordem] .btn.primary{text-transform:uppercase;letter-spacing:.1em;font-weight:600}
:root[data-mode=ordem] .chip{letter-spacing:.04em}

/* fundos animados (Sangue escorrendo, Energia com glitch): ficam atrás da Home e do login e somem no editor e no jogo */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
body:has(#app) #fx,body:has(.play) #fx{display:none}
body:has(#fx) .hero{background:color-mix(in srgb,var(--bg2) 84%,transparent)}
.fx-blood .bgp{position:absolute;inset:0;background-repeat:no-repeat;background-position:center bottom;image-rendering:pixelated}
.fx-blood .bm{position:absolute;image-rendering:pixelated}

.fx-know .kq{position:absolute;left:0;top:0;visibility:hidden;transition:opacity .22s ease;white-space:nowrap;font:italic var(--fs)/1.1 'IM Fell DW Pica','Cormorant Garamond',Georgia,'Times New Roman',serif;color:rgba(255,201,51,.42);letter-spacing:.02em;text-shadow:0 0 14px rgba(232,169,0,.25)}
.fx-know.kb .kq{opacity:0}
.fx-glitch .rn{position:absolute;top:0;left:var(--x);font:var(--fs)/1.2 'Share Tech Mono',ui-monospace,monospace;white-space:pre;text-align:center;color:transparent;background:linear-gradient(to bottom,transparent 0,rgba(166,92,245,.28) 25%,rgba(166,92,245,.7) 78%,rgba(205,248,255,.95) 100%);-webkit-background-clip:text;background-clip:text;opacity:.75;will-change:transform;animation:matrixrain var(--d) var(--dl) linear infinite}
@keyframes matrixrain{from{transform:translateY(-100%)}to{transform:translateY(100vh)}}
.fx-glitch .gb{position:absolute;top:var(--t);left:var(--l);width:var(--w);height:var(--h);background:linear-gradient(90deg,transparent,var(--c) 14%,var(--c) 86%,transparent);opacity:0;will-change:transform,opacity;animation:glitchbar var(--d) var(--dl) steps(1,end) infinite}
.fx-glitch .gb:nth-child(3n){height:calc(var(--h) * 1.6);background:linear-gradient(90deg,transparent,var(--c) 6%,var(--c) 94%,transparent)}
body:has(.fx-glitch) .home .hero,body:has(.fx-glitch) .screen.center>.brand{animation:screenglitch 5.2s steps(1,end) infinite}
@keyframes screenglitch{0%,90%,100%{transform:none;filter:none}91%{transform:translate(-5px,1px) skewX(-2deg);filter:drop-shadow(3px 0 0 rgba(0,235,255,.7)) drop-shadow(-3px 0 0 rgba(255,40,210,.7))}93%{transform:translate(6px,-1px);filter:drop-shadow(-4px 0 0 rgba(0,235,255,.7)) drop-shadow(4px 0 0 rgba(255,40,210,.7))}95%{transform:translate(-2px,0) skewX(1deg);filter:none}97%{transform:none}}
.fx-glitch .gf{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,235,255,.06) 0 2px,rgba(255,40,210,.06) 2px 4px);opacity:0;will-change:opacity;animation:glitchflash 5.7s steps(1,end) infinite}
@keyframes glitchbar{0%,74%{opacity:0;transform:translateX(0)}75%{opacity:1;transform:translateX(var(--dx))}78%{opacity:.35;transform:translateX(calc(var(--dx) * -1.7))}81%{opacity:1;transform:translateX(calc(var(--dx) * .6))}84%{opacity:0}87%{opacity:.8;transform:translateX(calc(var(--dx) * -.4))}89%,100%{opacity:0}}
@keyframes glitchflash{0%,93%{opacity:0}94%{opacity:1}95%{opacity:0}96%{opacity:.7}97%,100%{opacity:0}}
/* decoração de página (fora do palco): oscilação do Medo */
:root[data-theme=medo] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.7));animation:flick 6s steps(1) infinite}
body:has(.play)::before,body:has(#app)::before{display:none!important}
@keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.35}94%{opacity:1}96%{opacity:.6}}
@keyframes stampin{0%{opacity:0;transform:rotate(-6deg) scale(1.9)}55%{opacity:1;transform:rotate(-6deg) scale(.96)}100%{opacity:.9;transform:rotate(-6deg) scale(1)}}
@keyframes ruledraw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.nomotion body::before,.nomotion *:not(.spin){animation:none!important;transition:none!important}
/* sistema pedindo menos movimento: os fundos continuam (gotas e faixas), mas sem o tremor da tela */
@media (prefers-reduced-motion:reduce){body::before,body::after,.hero::after,.hero .rule,body:has(.fx-glitch) .home .hero,body:has(.fx-glitch) .screen.center>.brand{animation:none!important}}

/* ============ editor do mestre ============ */
#app{display:grid;height:100dvh;grid-template-columns:64px minmax(0,1fr) 340px;grid-template-rows:48px minmax(0,1fr) 42px}
#top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:8px;padding:0 10px;padding-right:var(--dock-w,180px);background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#top .cname{width:200px;font-weight:600;flex:none}#top .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
#top>*{flex:none}
#tools{grid-column:1;grid-row:2;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto}
.tool{background:none;border:1px solid transparent;border-radius:9px;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:1px;touch-action:manipulation}
.tool:hover{background:var(--bg3)}.tool.on{background:var(--ac-soft);border-color:var(--ac2)}.tool .ic{font-size:19px;line-height:1.1}.tool .tl{font-size:10px;color:var(--mut)}.tool.on .tl{color:var(--tx)}.tools .sp,#tools .sp{flex:1}
#center{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0}
#optbar{display:flex;gap:16px;align-items:center;padding:6px 12px;background:color-mix(in srgb,var(--bg) 80%,var(--bg2));border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
#optbar label{display:flex;align-items:center;gap:8px}#optbar input[type=range]{width:120px}#optbar select{width:auto}
#stagewrap{position:relative;flex:1;min-height:0;background:#000}
.stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--pop);border:1px solid var(--ac2);padding:6px 12px;border-radius:14px;font-size:13px;display:flex;gap:8px 10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:3;max-width:calc(100% - 20px);box-shadow:0 8px 30px var(--shade)}
.banner select{width:auto;max-width:min(300px,60vw)}
.emptystate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:12px}.emptystate .card{pointer-events:auto;text-align:left}
#panel{grid-column:3;grid-row:2;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:5}
.ptabs{display:flex;border-bottom:1px solid var(--line)}.ptab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer;color:var(--mut);font-size:12.5px}.ptab.on{color:var(--tx);border-color:var(--ac2)}
.pbody{padding:12px;overflow:auto;flex:1;min-height:0}
#areasbar{grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.menuwrap{position:relative}.menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--pop);border:1px solid var(--line);border-radius:10px;min-width:220px;padding:6px;z-index:30;box-shadow:0 14px 40px var(--shade);display:flex;flex-direction:column}
.menu.up{top:auto;bottom:calc(100% + 6px)}.menu[hidden]{display:none}.menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}.menu button:hover{background:var(--bg3)}
.panel-toggle{display:none}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}.citem{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
.citem canvas{border-radius:6px;max-width:100%}.citem:hover{border-color:var(--line2)}.citem.on{border-color:var(--ac2);color:var(--tx);background:var(--ac-soft);box-shadow:0 0 0 2px var(--ac2) inset}
.ititle{font-weight:700;font-size:15px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;align-items:center;margin:7px 0;font-size:13px}.row>span{color:var(--mut)}
.row.chkrow{grid-template-columns:auto 1fr auto}.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac2)}.inline{display:flex;gap:6px}
.osec .lbl{margin-top:12px}.orow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}.orow:hover{background:var(--bg3)}.orow.on{background:var(--ac-soft2);outline:1px solid var(--ac)}.on-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg3)}.prow.on{border-color:var(--ac2)}.pav{width:42px;height:42px;background:var(--inp);border-radius:8px}.pinfo{flex:1;min-width:0}.pname{font-weight:600;margin-bottom:4px}.pact{display:flex;flex-direction:column;gap:4px}
.chips.mini .chip{padding:2px 8px;font-size:11px}
.tscale{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:4px 10px 8px;margin-bottom:12px}.tscale .lbl{margin-top:8px}
.ced-top{display:flex;gap:14px;align-items:center}.cprev{width:112px;height:112px;border-radius:12px;border:1px solid var(--line);flex:none}.ced-fields{flex:1;min-width:0}.ced-fields .btnrow{margin:8px 0 0}
.ced .two{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:10px 0}.ced .two label{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
.crop{display:grid;gap:4px;margin:10px 0}.crop label{display:grid;grid-template-columns:50px 1fr;font-size:12px;color:var(--mut);align-items:center}
.optbar-x{margin-left:auto}.popmenu{position:fixed!important;top:0;left:0;z-index:80}

/* ============ jogador ============ */
.play{position:fixed;inset:0;background:#000;overflow:hidden}
.waiting{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000d;z-index:4}.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--ac2);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:6}.fade.on{opacity:1}
.hud-tl{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;display:flex;gap:8px;z-index:3;align-items:center}
.pill{background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;color:var(--tx)}.btn-pill{cursor:pointer}.btn-pill:hover{border-color:var(--line2)}
.pill.logo-pill{padding:5px 8px}.pill.logo-pill canvas{width:22px;height:22px}
.hud-bl{position:absolute;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3}.me{display:flex;align-items:center;gap:8px;background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 5px;cursor:pointer;font-weight:600}.me canvas{width:36px;height:36px;border-radius:50%;background:var(--bg2)}
.hud-br{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}.fab{width:44px;height:44px;border-radius:50%;background:var(--hud);border:1px solid var(--line);font-size:20px;cursor:pointer;}

/* ---- core.js ---- */

/* ---------- Assets (imagens) ---------- */
const Assets = {
  data: {},      // id -> dataURL
  imgs: {},      // id -> Image carregada
  loading: {},
  onLoad: null,
  put(id, url) { this.data[id] = url; delete this.imgs[id]; delete this.loading[id]; if (this.onLoad) this.onLoad(id); },
  has(id) { return !!this.data[id]; },
  get(id) {
    if (!id) return null;
    if (this.imgs[id]) return this.imgs[id];
    const url = this.data[id];
    if (!url || this.loading[id]) return null;
    this.loading[id] = true;
    const done = img => { this.imgs[id] = img; delete this.loading[id]; if (this.onLoad) this.onLoad(id); };
    if (globalThis.__loadImage) { globalThis.__loadImage(url).then(done).catch(() => { delete this.loading[id]; }); }

/* ---------- Modelo da campanha ---------- */
function newCampaign() {
  return { v: 1, name: 'Nova campanha', grid: 48, tokenScale: 1, snap: true, showGrid: true, areas: [], elements: [], walls: [], zones: [], fog: [], lights: [], creatures: [], characters: {} };
}
function newArea(c, x, y, w, h, extra) {
  return Object.assign({ id: uid('a'), name: 'Área ' + (c.areas.length + 1), x, y, w, h, color: '#16181b', bg: null, darkness: 0, ambient: '#04050a', reveal: 'auto' }, extra || {});
}
function freeSpotX(c) { // onde colocar um novo anexo sem sobrepor
  let m = 0; for (const a of c.areas) m = Math.max(m, a.x + a.w); return c.areas.length ? m + c.grid * 6 : 0;

const STATES = [['normal', 'Normal'], ['dying', 'Morrendo'], ['dead', 'Morto']];
const FRAMES = [['circle', 'Círculo'], ['rounded', 'Arredondado'], ['square', 'Quadrado'], ['hex', 'Hexágono'], ['full', 'Corpo inteiro']];

function newCharacter(pid, name) {
  return { id: pid, owner: pid, name: name || 'Jogador', asset: null, frame: 'circle', color: '#c9a227', state: 'normal', alpha: 1, size: 1, x: 0, y: 0 };

function newCreature(x, y) {
  return { id: uid('n'), name: 'Criatura', x, y, size: 1, asset: null, frame: 'rounded', color: '#a31621', state: 'normal', alpha: 1, hidden: true, nameVis: false };

/* ---- art.js ---- */
'use strict';
/* ===== art.js — kit de pixel art procedural =====
   Estilo: top-down em pixel art com contorno escuro, sombreamento em 5 tons com troca de matiz

   1 célula = PX pixels de arte; o resultado é ampliado sem suavização. */

const PX = 16;

  line(x0, y0, x1, y1, col) {

  rr(x, y, w, h, col, cut) {

  }
  /* bloco com contorno escuro e bisel: fill m, luz em cima/esquerda, sombra embaixo/direita */

  /* gradiente com dither ordenado entre duas cores; dir: 'v' (cima→baixo), 'h', 'd' (diagonal) */
  grad(x, y, w, h, c1, c2, dir, lo, hi) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h); lo = lo == null ? 0 : lo; hi = hi == null ? 1 : hi;

  dith(x, y, w, h, col, d) { x = Math.round(x); y = Math.round(y); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (d > bay(x + i, y + j)) this.p(x + i, y + j, col); return this; }

    for (let j = Math.floor(cy - ry); j < Math.ceil(cy + ry); j++) for (let i = Math.floor(cx - rx); i < Math.ceil(cx + rx); i++) { const dx = (i + .5 - cx) / rx, dy = (j + .5 - cy) / ry; if (dx * dx + dy * dy <= 1 && d > bay(i, j)) this.p(i, j, col); }

  blob(cx, cy, rx, ry, r, o) {
    o = o || {}; const out = o.out || r.d3; this.ell(cx, cy, rx + 1, ry + 1, out); this.ell(cx, cy, rx, ry, r.d1);

/* utilitários de textura reutilizados pelo catálogo */
function jitterTone(r, R, bias) { const k = R() + (bias || 0); return k < .22 ? r.d1 : k < .72 ? r.m : k < .93 ? r.l1 : r.l2; }

function rrPath(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();

/* ---- catalog.js ---- */
'use strict';
/* ===== catalog.js — elementos pré-definidos (pixel art procedural) =====
   Referências de estilo: mapas de mesa de Ordem Paranormal (base sombria, laboratório, ilha com vila),
   Moonlighter (cores quentes, contorno, sombras), Enigma do Medo (horror em pixel art, tons frios e sujos).
   Cada elemento: pdraw(P, W, H, o) desenha em pixels de arte (1 célula = PX px).
   o = { color, r (rampa da cor), R (aleatório com semente), time, frame } */

const CATALOG = {};
const CATS = [['floor', 'Pisos'], ['struct', 'Estruturas'], ['furn', 'Mobília'], ['lab', 'Lab / Ritual'], ['nature', 'Natureza'], ['build', 'Construções']];
function defEl(id, cat, name, cw, ch, layer, color, pdraw, extra) {
  CATALOG[id] = Object.assign({ id, cat, name, cw, ch, layer, color, pdraw, pad: layer === 0 ? 0 : 2, clip: layer === 0 }, extra || {});
}
const BONE = RP('#e9e4d2'), IRON = RP('#59606a'), GOLD = RP('#d9a933'), WOODR = RP('#8a5a32');
const hash2 = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + (s | 0) * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

/* ---------------- PISOS ---------------- */
defEl('concrete', 'floor', 'Concreto', 4, 4, 0, '#686e72', (P, W, H, o) => {
  const r = o.r, R = P.R, S = 32; P.f(0, 0, W, H, r.m);
  for (let y = 0; y < H; y += S) for (let x = 0; x < W; x += S) {
    const t = R(); P.f(x, y, S, S, t < .25 ? r.d1 : t < .82 ? r.m : r.l1);
    P.dith(x, y, S, S, r.d1, .03 + R() * .05); P.hl(x, y, S, r.d3); P.vl(x, y, S, r.d3); P.hl(x + 1, y + 1, S - 1, r.l1); P.vl(x + 1, y + 1, S - 1, r.l1);
  }
  P.noise(0, 0, W, H, [r.d1, r.d2, r.l1], .05);
  for (let i = 0; i < W * H / 1400; i++) P.dithE(R() * W, R() * H, 4 + R() * 9, 3 + R() * 6, r.d2, .3);
  for (let i = 0; i < W * H / 1800; i++) crack(P, R() * W, R() * H, 6 + R() * 20, r.d3);
  for (let i = 0; i < W * H / 2400; i++) { const x = R() * W, y = R() * H; P.f(x, y, 2, 1, r.d3); P.p(x, y + 1, r.l1); }
});
defEl('tiles', 'floor', 'Azulejo (hospital)', 4, 4, 0, '#c4c8be', (P, W, H, o) => {
  const r = o.r, R = P.R; P.f(0, 0, W, H, r.d2);
  for (let y = 0; y < H; y += 8) for (let x = 0; x < W; x += 8) {
    const k = R(), tone = k < .15 ? r.d1 : k < .65 ? r.m : k < .93 ? r.l1 : r.l2;
    P.f(x + 1, y + 1, 7, 7, tone); P.hl(x + 1, y + 1, 7, r.l3); P.vl(x + 1, y + 1, 7, r.l2); P.hl(x + 1, y + 7, 7, r.d1); P.vl(x + 7, y + 1, 7, r.d1);
    if (R() < .12) P.dith(x + 1, y + 1, 7, 7, r.d1, .3);
  }
  P.noise(0, 0, W, H, [r.d1, r.d2], .018);
  for (let i = 0; i < W * H / 2600; i++) { const x = R() * W, y = R() * H; crack(P, x, y, 5 + R() * 8, r.d3); }
  for (let i = 0; i < W * H / 3000; i++) P.dithE(R() * W, R() * H, 3 + R() * 4, 2 + R() * 3, '#6f5a3a', .25);
});
defEl('wood', 'floor', 'Piso de madeira', 4, 4, 0, '#94602f', (P, W, H, o) => {
  const r = o.r, R = P.R, ph = 5; P.f(0, 0, W, H, r.d3);

function leafCluster(P, cx, cy, rx, ry, r, R, n) {
  const blobs = []; for (let i = 0; i < n; i++) { const a = R() * 6.28, d = R() * .55; blobs.push([cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, rx * (.34 + R() * .2), ry * (.34 + R() * .2)]); }
  blobs.sort((a, b) => a[1] - b[1]);
  for (const b of blobs) P.ell(b[0], b[1], b[2] + 1, b[3] + 1, r.d3);
  for (const b of blobs) { P.ell(b[0], b[1], b[2], b[3], r.d1); P.ell(b[0] - b[2] * .08, b[1] - b[3] * .15, b[2] * .84, b[3] * .8, r.m); P.ell(b[0] - b[2] * .25, b[1] - b[3] * .35, b[2] * .5, b[3] * .4, r.l1); P.dithE(b[0] - b[2] * .3, b[1] - b[3] * .4, b[2] * .28, b[3] * .22, r.l2, .8); }
}

function shingleRows(P, x, y, w, h, hex, vert) {
  const r = RP(hex), dk = r.d2, lt = r.l1; P.f(x, y, w, h, hex);
  if (!vert) {
    for (let j = 0, row = 0; j < h; j += 3, row++) { P.hl(x, y + j + 2, w, dk); P.hl(x, y + j, w, lt); for (let i = (row % 2) * 3; i < w; i += 6) P.vl(x + i, y + j, 3, r.d1); }
  } else {
    for (let j = 0, col = 0; j < w; j += 3, col++) { P.vl(x + j + 2, y, h, dk); P.vl(x + j, y, h, lt); for (let i = (col % 2) * 3; i < h; i += 6) P.hl(x + j, y + i, 3, r.d1); }
  }
  P.dith(x, y, w, h, r.d1, .06);
}
function gable(P, x, y, w, h, hex, vert, R) {
  const r = RP(hex); P.shadowR(x, y, w, h, 3, 3, .5); P.f(x - 1, y - 1, w + 2, h + 2, OUTC);
  if (!vert) {
    const hf = Math.floor(h / 2); shingleRows(P, x, y, w, hf, r.m, false); shingleRows(P, x, y + hf, w, h - hf, r.d1, false); P.f(x, y + hf - 1, w, 2, r.l2); P.hl(x, y + hf + 1, w, r.d3); P.hl(x, y, w, r.l2); P.hl(x, y + h - 1, w, r.d3); P.vl(x, y, h, r.l1); P.vl(x + w - 1, y, h, r.d3);
    P.dith(x, y + hf + 2, w, 3, r.d3, .35);
  } else {
    const wf = Math.floor(w / 2); shingleRows(P, x, y, wf, h, r.m, true); shingleRows(P, x + wf, y, w - wf, h, r.d1, true); P.f(x + wf - 1, y, 2, h, r.l2); P.vl(x + wf + 1, y, h, r.d3); P.vl(x, y, h, r.l2); P.vl(x + w - 1, y, h, r.d3); P.hl(x, y, w, r.l1); P.hl(x, y + h - 1, w, r.d3);
    P.dith(x + wf + 2, y, 3, h, r.d3, .35);
  }
  if (R && R() < .8) for (let i = 0; i < 3; i++) P.dithE(x + R() * w, y + R() * h, 2 + R() * 3, 1.5 + R() * 2, '#4a6a3a', .35);
}

/* ---- lights.js ---- */
'use strict';
/* ===== lights.js — elementos luminosos =====
   Cada luz: { kind, x, y, r (raio em px de mundo), color, intensity 0..1, dir (graus, 0 = →, 90 = ↓),
               spread (abertura em graus; 360 = todas as direções), flicker, on }
   Tipos: natural (só luz, sem ícone), tocha, poste, lamparina, luz de teto, led. */

const LIGHT_TYPES = {
  natural: { name: 'Fonte natural', size: 0, r: 6, color: '#fff1cf', intensity: .85, spread: 360, flicker: false, note: 'Só a luz, sem ícone (lua, brilho, janela…)' },
  torch: { name: 'Tocha', size: .85, r: 5, color: '#ff9a3a', intensity: .95, spread: 360, flicker: true, anim: true },
  post: { name: 'Poste', size: .95, r: 8, color: '#ffe7ac', intensity: .9, spread: 360, flicker: false },
  lamp: { name: 'Lamparina', size: .6, r: 3.5, color: '#ffb347', intensity: .9, spread: 360, flicker: true, anim: true },
  ceiling: { name: 'Luz de teto', size: .85, r: 6, color: '#f6f2e4', intensity: .85, spread: 360, flicker: false },
  led: { name: 'Led', size: .7, r: 5, color: '#8fe3ff', intensity: .9, spread: 90, flicker: false, rot: true }
};
const LIGHT_ORDER = ['natural', 'torch', 'post', 'lamp', 'ceiling', 'led'];
function lightKind(l) { return LIGHT_TYPES[l.kind] ? l.kind : 'lamp'; }
function lightDefaults(kind, grid) { const T = LIGHT_TYPES[kind] || LIGHT_TYPES.lamp; return { kind, r: T.r * (grid || 48), color: T.color, intensity: T.intensity, spread: T.spread, flicker: T.flicker, dir: kind === 'led' ? 90 : 0 }; }
function lightAnimated(l) { const T = LIGHT_TYPES[lightKind(l)]; return l.on !== false && (l.flicker || T.anim); }
function lightFlick(l, time) { return l.flicker ? (.82 + .12 * Math.sin(time / 83 + l.x) + .06 * Math.sin(time / 37 + l.y)) : 1; }

/* Preenche a luz com um gradiente radial restrito ao cone. mode 'cut' acumula por destination-out; 'add' por screen.
   Vários cones sobrepostos, cada vez mais estreitos, dão uma borda suave. */
function lightPaint(c, l, I, stops, mode) {
  const sp = clamp(l.spread == null ? 360 : l.spread, 8, 360), dir = (l.dir || 0) * Math.PI / 180, R = l.r;

  const kind = lightKind(l), T = LIGHT_TYPES[kind]; if (!T.size || !LIGHT_DRAW[kind]) return;

  const col = l.color || T.color, key = [kind, on ? 1 : 0, frame, col].join('|');

  if (!ent) {

    try { LIGHT_DRAW[kind](P, AW, AH, { on, frame, rp, color: col }); } catch (err) { if (typeof console !== 'undefined') console.error('luz falhou', kind, err); }

  }
  const sc = (grid || 48) / PX, w = (AW + 2 * pad) * sc, hh = (AH + 2 * pad) * sc;

   Ordem: nome, dano, crítico, tipo, empunhadura, espaços e categoria seguem a transcrição do Livro Base e do suplemento
   “Sobrevivendo ao Horror” (SaH). Itens marcados “Item de mesa” NÃO estão no livro (são conveniências do app).
   D&D: valores do SRD 5.1 (custo em po/pp/pc, peso convertido para kg). Tudo é referência — confira no seu livro. */
const RN = ['0', 'I', 'II', 'III', 'IV'];
const ITEM_ALIAS = { op_granada_luz: 'op_granada_atordoamento' };          // ids antigos → ids atuais
const kg = lb => (lb * 0.4536).toFixed(lb < 1 ? 2 : 1).replace('.', ',') + ' kg';
const esp = n => String(n).replace('.', ',');

/* ---------- Ordem Paranormal ---------- */
const GRIP = { L: 'leve', 1: 'uma mão', 2: 'duas mãos' };
function OW(id, name, kind, grip, glyph, color, dmg, crit, tipo, alc, e, cat, prof, desc, alias) {
  OP(id, name, kind, grip === 2 ? 'two' : 'main', glyph, color, dmg + ' · ' + crit + ' · ' + tipo + (alc ? ' · alc. ' + alc : '') + ' · ' + GRIP[grip] + ' · ' + esp(e) + ' esp · Cat. ' + RN[cat], prof + '. ' + (desc || ''), { alias: alias || '' });
}
function OI(id, name, type, slot, glyph, color, cat, e, efeito, desc, extra) {
  OP(id, name, type, slot, glyph, color, (efeito ? efeito + ' · ' : '') + 'Cat. ' + RN[cat] + ' · ' + esp(e) + ' esp', desc || '', extra);
}

function DW(id, name, cat, grip, glyph, color, stats, custo, lb, desc, extra) {
  DN(id, name, cat, grip === 2 ? 'two' : 'main', glyph, color, stats, 'Custo ' + custo + (lb ? ' · ' + kg(lb) : '') + (desc ? ' · ' + desc : ''), extra);
}
function DG(id, name, cat, slot, glyph, color, stats, custo, lb, desc, extra) {
  DN(id, name, cat, slot, glyph, color, stats, (custo ? 'Custo ' + custo : '') + (lb ? ' · ' + kg(lb) : '') + (desc ? ' · ' + desc : ''), extra);
}

/* ---- fx.js ---- */
/* ---------- fundos animados em canvas: Sangue (gotas que se soltam) e Medo (névoa texturizada) ----------
   Sangue: cada fio escorre numa trilha que ondula (meandro), engrossa a ponta, afina o pescoço (Plateau–Rayleigh),
   solta uma gota que cai com gravidade, balança e, às vezes, deixa um rastro fino ou perolas pequenas; o resto recua.
   Parte dos fios, em vez de soltar gota, empaca no meio do caminho e se espalha. Valores em research_notes/. */

/* fundo do Sangue: GIF pixel art ancorado embaixo (escala inteira = pixels nítidos) + lua vermelha desenhada na mesma grade, à direita */
function bloodMoonCanvas() {
  const N = 72, cv = document.createElement('canvas'); cv.width = cv.height = N; const x = cv.getContext('2d'), c0 = 36, R = 21;
  const LV = ['#7c1620', '#98222a', '#b23034', '#cc4442', '#e8544c', '#ff7a6c'], B = [[0, 2], [3, 1]], L = [-.55, -.7, .45], ln = Math.hypot(...L);
  const craters = [[-7, -6, 4.5], [7, 4, 5.5], [-2, 10, 3.2], [10, -8, 2.8], [-12, 4, 2.5]];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const dx = i + .5 - c0, dy = j + .5 - c0, d = Math.hypot(dx, dy);
    if (d < R) {
      const nx = dx / R, ny = dy / R, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)), lam = Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) / ln);
      let lv = lam < .14 ? 0 : lam < .3 ? 1 : lam < .5 ? 2 : lam < .72 ? 3 : lam < .9 ? 4 : 5; if (d > R - 1.2 && lv > 1) lv -= 1;
      for (const [cx, cy, cr] of craters) { const q = Math.hypot(dx - cx, dy - cy); if (q < cr) lv -= 1; }
      x.fillStyle = LV[Math.max(0, Math.min(5, lv))]; x.fillRect(i, j, 1, 1);
    } else if (d < R + 14) {
      const k = (d - R) / 14, a = k < .3 ? .2 : k < .62 ? .11 : .05;
      { x.fillStyle = 'rgba(255,110,100,' + a + ')'; x.fillRect(i, j, 1, 1); }
    }
  }
  return cv;
}
function bloodScene(box) {
  const bg = document.createElement('i'); bg.className = 'bgp'; bg.style.backgroundImage = 'url(' + BLOOD_GIF + ')';
  const mn = bloodMoonCanvas(); mn.className = 'bm'; box.append(bg, mn);
  const place = () => {
    const W = innerWidth, H = innerHeight, s = Math.ceil(Math.max(W / 256, H / 224)), ox = (W - 256 * s) / 2, oy = H - 224 * s;
    bg.style.backgroundSize = 256 * s + 'px ' + 224 * s + 'px';

class PlayerEngine {
  constructor(me, io) { this.me = me; this.io = io; this.view = null; this.inv = []; this.asked = {}; this.welcomed = false; this.mine = null; }
  hello() { this.io.send({ t: 'hello', d: { pid: this.me.id, name: this.me.name, char: this.me.char } }); }
  sendChar(patch) { Object.assign(this.me.char, patch); if (patch.name) this.me.name = patch.name; this.io.send({ t: 'char', d: patch }); }
  uploadAsset(id, data) { Assets.put(id, data); this.io.send({ t: 'asset', d: { id, data } }); }
  mineTokens() { return this.view ? this.view.tokens.filter(t => t.kind === 'c' && t.owner === this.me.id) : []; }

  setActive(cid) { if (this.mineIds().includes(cid) && this.active !== cid) { this.active = cid; this.inv = []; this.io.send({ t: 'active', d: { cid } }); if (this.io.inv) this.io.inv(); } }
  move(x, y, end, cid) { this.io.send({ t: 'move', d: { x, y, end: !!end, cid: cid || this.activeId() } }); }
  zone(zid) { this.io.send({ t: 'zone', d: { zid, cid: this.activeId() } }); }
  equip(iid, on) { const e = (this.inv || []).find(x => x.id === iid); if (e) e.eq = !!on; this.io.send({ t: 'equip', d: { iid, on: !!on } }); }
  itemOn(iid, on) { const e = (this.inv || []).find(x => x.id === iid); if (e) e.on = !!on; this.io.send({ t: 'itemon', d: { iid, on: !!on } }); }
  ping() { this.io.send({ t: 'ping' }); }
  needAssets() {
    if (!this.view) return;
    const ids = new Set();
    for (const a of this.view.areas) if (a.bg) ids.add(a.bg);
    for (const t of this.view.tokens) { if (t.asset) ids.add(t.asset); for (const q of t.eq || []) if (q[2]) ids.add(q[2]); }

  }

    const d = m.d || {};

      case 'view':

      case 'pos':
        if (!this.view) break;
        for (const p of d.tk) { if (this.dragging && p[0] === this.dragId) continue; const t = this.view.tokens.find(q => q.id === p[0]); if (t) { t.x = p[1]; t.y = p[2]; } }
        this.view.prompts = d.pr || {}; this.io.update(); break;
      case 'inv': this.inv = d.list || []; this.invCid = d.cid || null; this.needAssets(); if (this.io.inv) this.io.inv(); break;
      case 'asset': Assets.put(d.id, d.data); this.io.assetIn ? this.io.assetIn() : this.io.update(); break;
      case 'welcome': this.welcomed = true; if (d.needAsset && this.me.char.asset && Assets.has(this.me.char.asset)) this.io.send({ t: 'asset', d: { id: this.me.char.asset, data: Assets.data[this.me.char.asset] } }); this.io.welcome && this.io.welcome(d); break;
      case 'tp': this.io.teleport && this.io.teleport(d); break;
      case 'toast': this.io.toast && this.io.toast(d.msg); break;

}

function tplHelpers(C, ox, oy, fn) {

    wall(cx, cy, cx + cw, cy, gp.t); wall(cx + cw, cy, cx + cw, cy + ch, gp.r); wall(cx + cw, cy + ch, cx, cy + ch, gp.b ? gp.b.map(q => [cw - q[1], cw - q[0]]) : null); wall(cx, cy + ch, cx, cy, gp.l ? gp.l.map(q => [ch - q[1], ch - q[0]]) : null);

  return { g, X, Y, el, wall, room, door };

      for (const m of mine) mesasEl.append(h('div', { class: 'mesa' + (last && last.id === m.id ? ' last' : '') }, icon('master'), h('div', { class: 'mi' }, h('b', {}, m.name), h('span', { class: 'muted sm' }, 'código ' + m.code)),
        h('div', { class: 'ma' }, h('button', { class: 'btn small primary', onclick: async e => { e.target.disabled = true; try { startMaster({ cloud: await Cloud.loadCampaign(m.id) }); } catch (x) { toast(friendlyAuthError(x)); e.target.disabled = false; } } }, 'Abrir'),
          h('button', { class: 'btn small', title: 'Renomear', onclick: () => renameModal(m) }, '✎'),
          h('button', { class: 'btn small danger', title: 'Excluir', onclick: () => askConfirm('Excluir "' + m.name + '" para sempre? Mapas, luzes e tudo da campanha serão apagados.', async () => { try { await Cloud.deleteCampaign(m.id); if (last && last.id === m.id) store.set('vtt-last', null); load(); } catch (x) { toast(friendlyAuthError(x)); } }, 'Excluir') }, '🗑'))));
      for (const m of part) partEl.append(h('div', { class: 'mesa' + (last && last.code === m.code ? ' last' : '') }, icon('player'), h('div', { class: 'mi' }, h('b', {}, m.name), h('span', { class: 'muted sm' }, 'código ' + m.code)),
        h('div', { class: 'ma' }, h('button', { class: 'btn small primary', onclick: () => enterTable(m.code) }, 'Jogar'), h('button', { class: 'btn small ghost', title: 'Sair da mesa', onclick: () => askConfirm('Sair da mesa "' + m.name + '"? Você poderá voltar com o código.', async () => { try { await Cloud.leaveCampaign(m.id); load(); } catch (x) { toast(friendlyAuthError(x)); } }, 'Sair da mesa') }, 'Sair'))));
    } catch (e) { mesasEl.innerHTML = ''; mesasEl.append(h('div', { class: 'err' }, friendlyAuthError(e))); }
    try {
      const cs = await Cloud.myCharacters(); chars.innerHTML = '';
      if (!cs.length) chars.append(h('div', { class: 'emptybox' }, 'Crie um personagem para entrar nas mesas rapidamente.'));
      for (const c of cs) {
        const cv = h('canvas', { width: 96, height: 96, class: 'pav' }); const pc = charToProfile(c);
        const paint = () => drawTokenAt(cv.getContext('2d'), { id: c.id, name: c.name, asset: pc.asset, frame: pc.frame, zoom: pc.zoom, ox: pc.ox, oy: pc.oy, color: pc.color, state: 'normal', alpha: 1 }, 48, 48, 84, { s: 1.5, time: 0 }); paint(); setTimeout(paint, 250);
        chars.append(h('div', { class: 'mesa' }, cv, h('div', { class: 'mi' }, h('b', {}, c.name)), h('div', { class: 'ma' }, h('button', { class: 'btn small', onclick: () => charModal(c) }, 'Editar'),
          h('button', { class: 'btn small danger', onclick: () => askConfirm('Excluir o personagem "' + c.name + '"?', async () => { try { await Cloud.deleteCharacter(c.id); load(); } catch (x) { toast(friendlyAuthError(x)); } }, 'Excluir') }, '🗑'))));
      }
    } catch (e) { chars.innerHTML = ''; chars.append(h('div', { class: 'err' }, friendlyAuthError(e))); }
  }
  function renameModal(m) {
    const i = h('input', { type: 'text', maxlength: 40, value: m.name }); modal('Renomear campanha', i, [{ label: 'Cancelar' }, { label: 'Salvar', cls: 'primary', fn: () => { Cloud.renameCampaign(m.id, i.value.trim() || m.name).then(load).catch(x => toast(friendlyAuthError(x))); } }]);
  }
  function charModal(c) {
    const ch = c ? charToProfile(c) : { name: '', frame: 'circle', color: '#c9a227', alpha: 1, state: 'normal', asset: null, zoom: 1, ox: 0, oy: 0 };
    const ed = CharacterEditor({ pid: userPid(), char: ch, onChange: () => { } });
    modal(c ? 'Editar personagem' : 'Novo personagem', ed, [{ label: 'Cancelar' }, { label: 'Salvar', cls: 'primary', fn: () => { if (!(ch.name || '').trim()) { toast('Dê um nome ao personagem.'); return false; } Cloud.saveCharacter(profileToChar(ch, c && c.id)).then(load).catch(x => toast(friendlyAuthError(x))); } }]);
  }
  load();
}

/* ---- ui_main.js ---- */
'use strict';
/* ===== ui_main.js — lobby e inicialização ===== */

function parseHash() {
  const o = {}; const hs = (location.hash || '').replace(/^#/, ''); if (!hs) return o;
  hs.split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });
  return o;
}
function showLobby() {
  resetScreen(); const root = $('#root'); root.innerHTML = '';
  const hs = parseHash(), saved = store.get('vtt-cfg', {}), prof = store.get('vtt-player', {});
  const join = { code: (hs.join || '').toUpperCase(), mode: hs.m || (hs.u ? 'online' : (saved.mode || 'local')), url: hs.u || saved.url || '', key: hs.k || saved.key || '' };
  const err = h('div', { class: 'err' });
  const codeIn = h('input', { type: 'text', maxlength: 8, placeholder: 'CÓDIGO', value: join.code, class: 'code', oninput: e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); } });
  const modeSel = h('select', { value: join.mode, onchange: () => adv() }, h('option', { value: 'local' }, 'Local (mesmo navegador)'), h('option', { value: 'online' }, 'Online (Supabase)'));
  const urlIn = h('input', { type: 'text', placeholder: 'https://xxxx.supabase.co', value: join.url }), keyIn = h('input', { type: 'password', placeholder: 'chave pública', value: join.key });
  const advBox = h('div', { class: 'adv' }, h('label', {}, 'Modo', modeSel), h('label', { class: 'online' }, 'URL', urlIn), h('label', { class: 'online' }, 'Chave', keyIn));
  const showAdv = !hs.join;
  function adv() { advBox.querySelectorAll('.online').forEach(e => e.style.display = modeSel.value === 'online' ? '' : 'none'); }
  adv();
  const go = () => {
    const code = codeIn.value.trim(); if (code.length < 3) { err.textContent = 'Digite o código da mesa que o mestre enviou.'; return; }
    const cfg = { mode: modeSel.value, url: urlIn.value.trim(), key: keyIn.value.trim() };
    if (cfg.mode === 'online' && (!cfg.url || !cfg.key)) { err.textContent = 'Informe a URL e a chave (ou use o link completo enviado pelo mestre).'; return; }
    startPlayer(code, cfg);
  };
  root.append(h('div', { class: 'screen center lobby' },
    brandHero(),
    h('div', { class: 'cards' },
      h('div', { class: 'card' + (hs.join ? ' dim' : '') }, h('h2', {}, 'Montar a mesa'), h('p', { class: 'muted' }, 'Crie mapas com o catálogo ou com uma imagem, posicione zonas, luzes, névoa e criaturas ocultas.'),
        h('button', { class: 'btn primary big', onclick: () => startMaster() }, 'Abrir editor do mestre')),
      h('div', { class: 'card' + (hs.join ? ' hl' : '') }, h('h2', {}, 'Entrar na mesa'), h('p', { class: 'muted' }, prof.name ? 'Bem-vindo de volta, ' + prof.name + '.' : 'Use o código (ou o link) que o mestre compartilhou.'),
        codeIn, showAdv ? h('details', {}, h('summary', {}, 'Conexão'), advBox) : advBox, err, h('button', { class: 'btn primary big', onclick: go }, 'Continuar')))));
  if (hs.join) advBox.style.display = 'none';
  codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
/* inicialização: links antigos (modo local / URL própria) vão para o lobby; o resto passa pela conta */
async function boot() {
  Prefs.init(); mountDock(); Prefs.on(v => { document.querySelectorAll('[data-tagline]').forEach(e => { e.textContent = THEMES[v.theme].tag; }); paintDock(); });
  const hs = parseHash();
  if (hs.m === 'local' || hs.u) return showLobby();
  const root = $('#root'); root.innerHTML = ''; root.append(h('div', { class: 'screen center' }, h('div', { class: 'spin' }), h('p', { class: 'muted' }, 'Conectando…')));
  try { await Cloud.init(); Cloud.onAuth(() => paintDock()); } catch (e) { toast('Modo offline: ' + (e.message || e), 4500); return showLobby(); }
  if (hs.join) setPending(hs.join.toUpperCase());
  if (!Cloud.user) return showAuth({ joinCode: hs.join ? hs.join.toUpperCase() : '' });
  try { await afterLogin(); } catch (e) { console.error(e); toast(friendlyAuthError(e), 4500); showAuth(); }
}
window.addEventListener('DOMContentLoaded', () => { boot(); });
